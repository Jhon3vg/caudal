<!-- Logo de Caudal: dos olas que avanzan sobre el degradado morado de la tarjeta principal; el punto es la plata que llega.
     Fuente de los íconos PNG (python3 src/marca/iconos.py). El mismo trazo, en pequeño, es la marca dentro de la app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="morado" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2E1065"/><stop offset=".5" stop-color="#5B21B6"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#morado)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round">
    <path d="M20 41c7.5-8 15-8 22.5 0s15 8 22.5 0"/>
    <path d="M20 60c7.5-8 15-8 22.5 0s15 8 22.5 0"/>
  </g>
  <circle cx="79" cy="60" r="5.5" fill="#FFFFFF"/>
</svg>
